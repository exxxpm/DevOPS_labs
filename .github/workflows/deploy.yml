name: CD Lab 4

on:
  release:
    types: [ published ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2426 course.prafdin.ru >> ~/.ssh/known_hosts

      - name: Deploy compose stack on devops VM (lab_4)
        run: |
          ssh -p 2426 deploy@course.prafdin.ru \
            'BRANCH=lab_4 /opt/app/deploy_lab4.sh'
