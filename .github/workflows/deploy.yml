name: Lab 2 CI/CD

on:
  push:
    branches: [ lab_2 ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Run simple tests
        run: python -m py_compile app.py

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2426 course.prafdin.ru >> ~/.ssh/known_hosts

      - name: Deploy to devops VM (lab_2)
        run: |
          ssh -p 2426 deploy@course.prafdin.ru \
            'BRANCH=lab_2 REPO_URL=https://github.com/exxxpm/DevOPS_labs.git /opt/app/deploy.sh'
