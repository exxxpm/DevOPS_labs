name: CI + Docker build (lab_3)

on:
  push:
    branches: [ "lab_3" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run simple tests
        run: python -m py_compile app.py

  docker-build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker build (sanity check)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false  # ВАЖНО: ничего никуда не пушим
          tags: devops-lab3:ci

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2426 course.prafdin.ru >> ~/.ssh/known_hosts

      - name: Deploy on devops VM (build & run container)
        run: |
          ssh -p 2426 deploy@course.prafdin.ru \
            'BRANCH=lab_3 REPO_URL=https://github.com/exxxpm/DevOPS_labs.git /opt/app/deploy_lab3.sh'
